<!DOCTYPE html>
<html>
<head>
<title>Faculty Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-image: url("attendance.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
}

.login-box{
    width:430px;
    background:white;
    padding:35px;
    border-radius:20px;
    margin-left:500px; 
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.login-box h2{
    text-align:center;
    color:#003366;
    margin-bottom:30px;
    
}

.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box i{
    position:absolute;
    left:15px;
    top:15px;
    color:#003366;
}

.input-box input{
    width:100%;
    padding:12px 12px 12px 45px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.input-box input:focus{
    outline:none;
    border:2px solid #003366;
}

button{
    width:100%;
    padding:12px;
    background:#003366;
    color:white;
    border:none;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0055aa;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#003366;
    font-weight:bold;
}

.back a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Faculty Login</h2>

<form action="Facultylogin.jsp" method="post">

<div class="input-box">
<i class="fas fa-user"></i>
<input type="text" name="username" placeholder="Enter Username" required>
</div>

<div class="input-box">
<i class="fas fa-lock"></i>
<input type="password" name="password" placeholder="Enter Password" required>
</div>

<button type="submit">
<i class="fas fa-sign-in-alt"></i> Login
</button>

</form>
 
<div class="back">
<a href="index.html">
<i class="fas fa-arrow-left"></i> Back to Home
</a>
</div>

</div>

</body>
</html>
